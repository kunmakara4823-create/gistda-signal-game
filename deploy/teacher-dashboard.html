<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Commander — Teacher Dashboard</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#0f1626; --border:#1f3864; --accent:#22d3ee;
    --text:#e6f1ff; --muted:#7fa0c8; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text);
    padding:32px 16px; min-height:100vh;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  h1{font-size:22px; letter-spacing:1px; color:var(--accent); margin-bottom:4px;}
  .sub{color:var(--muted); margin-bottom:24px; font-size:14px;}
  .dropzone{
    border:2px dashed var(--border); border-radius:12px; padding:48px 20px;
    text-align:center; color:var(--muted); cursor:pointer; transition:.2s;
    background:var(--panel);
  }
  .dropzone.drag{ border-color:var(--accent); color:var(--accent); background:#0d1b2e; }
  .dropzone input{ display:none; }
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin:24px 0;
  }
  .stat{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px; text-align:center;
  }
  .stat .num{font-size:24px; font-weight:700; color:var(--accent);}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  table{width:100%; border-collapse:collapse; margin-top:16px; font-size:14px;}
  th,td{padding:10px 12px; border-bottom:1px solid var(--border); text-align:left;}
  th{color:var(--accent); cursor:pointer; user-select:none; font-size:13px;}
  th:hover{color:#fff;}
  tr:hover{background:#0d1b2e;}
  .grade{font-weight:700; padding:2px 8px; border-radius:6px; font-size:12px;}
  .grade-S{background:#22c55e33; color:#22c55e;}
  .grade-A{background:#3b82f633; color:#60a5fa;}
  .grade-B{background:#f59e0b33; color:#f59e0b;}
  .grade-C{background:#ef444433; color:#f87171;}
  .actions{margin-top:16px; display:flex; gap:10px;}
  button{
    background:var(--accent); color:#00202b; border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; cursor:pointer; font-size:14px;
  }
  button.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .empty{color:var(--muted); text-align:center; padding:40px; font-size:14px;}
  .warn{color:var(--amber); font-size:13px; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 CLASS COMMANDER — TEACHER DASHBOARD</h1>
  <div class="sub">ลากไฟล์ CSV จาก AIP Dashboard ของนักเรียน (หลายไฟล์พร้อมกันได้) มาวางด้านล่าง เพื่อสรุปผลทั้งห้องอัตโนมัติ</div>

  <div class="dropzone" id="dropzone">
    <div id="dz-text">📁 ลากไฟล์ CSV มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์</div>
    <input type="file" id="fileInput" accept=".csv" multiple>
  </div>
  <div class="warn" id="warn"></div>

  <div class="stats" id="stats" style="display:none;"></div>

  <div id="tableWrap"></div>

  <div class="actions" id="actions" style="display:none;">
    <button id="exportSummary">📥 Export สรุปผลทั้งห้อง (CSV)</button>
    <button class="secondary" id="clearAll">ล้างข้อมูล</button>
  </div>
</div>

<script>
let rows = [];

function parseCSVLine(line){
  const out = []; let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQ = false; }
      } else { cur += c; }
    } else {
      if(c === '"'){ inQ = true; }
      else if(c === ','){ out.push(cur); cur=''; }
      else { cur += c; }
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text){
  const clean = text.replace(/^\uFEFF/, '').replace(/\r\n/g,'\n');
  const lines = clean.split('\n').filter(l => l.trim().length > 0);
  if(lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]).map(h => h.trim());
  const out = [];
  for(let i=1;i<lines.length;i++){
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (vals[idx]||'').trim());
    if(obj.StudentName || obj.Mission) out.push(obj);
  }
  return out;
}

function render(){
  const wrap = document.getElementById('tableWrap');
  const statsEl = document.getElementById('stats');
  const actionsEl = document.getElementById('actions');

  if(rows.length === 0){
    wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูล — ลากไฟล์ CSV มาวางด้านบน</div>';
    statsEl.style.display = 'none';
    actionsEl.style.display = 'none';
    return;
  }

  // stats
  const scores = rows.map(r => parseFloat(r['Score(%)'])).filter(n => !isNaN(n));
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const gradeCounts = {S:0,A:0,B:0,C:0};
  rows.forEach(r => { if(gradeCounts[r.Grade] !== undefined) gradeCounts[r.Grade]++; });

  statsEl.style.display = 'grid';
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${rows.length}</div><div class="lbl">จำนวนไฟล์/คน</div></div>
    <div class="stat"><div class="num">${avg.toFixed(1)}%</div><div class="lbl">คะแนนเฉลี่ยห้อง</div></div>
    <div class="stat"><div class="num">${gradeCounts.S}</div><div class="lbl">เกรด S</div></div>
    <div class="stat"><div class="num">${gradeCounts.A}</div><div class="lbl">เกรด A</div></div>
    <div class="stat"><div class="num">${gradeCounts.B}</div><div class="lbl">เกรด B</div></div>
    <div class="stat"><div class="num">${gradeCounts.C}</div><div class="lbl">เกรด C</div></div>
  `;

  // table, sorted by score desc by default
  const sorted = [...rows].sort((a,b)=> (parseFloat(b['Score(%)'])||0) - (parseFloat(a['Score(%)'])||0));
  let html = '<table><thead><tr>' +
    '<th>#</th><th>ชื่อ-สกุล</th><th>Mission</th><th>Grade</th><th>Score</th><th>Time(s)</th><th>Errors</th><th>Verification Code</th>' +
    '</tr></thead><tbody>';
  sorted.forEach((r,idx)=>{
    html += `<tr>
      <td>${idx+1}</td>
      <td>${r.StudentName || '-'}</td>
      <td>${r.Mission || r.LevelId || '-'}</td>
      <td><span class="grade grade-${r.Grade}">${r.Grade || '-'}</span></td>
      <td>${r['Score(%)'] || '-'}%</td>
      <td>${r['Time(s)'] || '-'}</td>
      <td>${r.Errors || '-'}</td>
      <td style="font-size:12px; color:var(--muted);">${r.VerificationCode || '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  actionsEl.style.display = 'flex';
}

function handleFiles(fileList){
  const warn = document.getElementById('warn');
  warn.textContent = '';
  const files = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.csv'));
  if(files.length === 0){
    warn.textContent = 'ไม่พบไฟล์ .csv ในรายการที่วาง';
    return;
  }
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = parseCSV(e.target.result);
        rows = rows.concat(parsed);
      }catch(err){
        warn.textContent += ` | อ่านไฟล์ ${file.name} ไม่สำเร็จ`;
      }
      pending--;
      if(pending === 0) render();
    };
    reader.readAsText(file, 'utf-8');
  });
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', (e)=> handleFiles(e.target.files));

['dragenter','dragover'].forEach(evt=>{
  dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt=>{
  dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.remove('drag'); });
});
dropzone.addEventListener('drop', (e)=>{
  e.preventDefault();
  const items = e.dataTransfer.files;
  handleFiles(items);
});

document.getElementById('clearAll').addEventListener('click', ()=>{
  if(confirm('ล้างข้อมูลทั้งหมดที่รวบรวมไว้?')){
    rows = [];
    render();
  }
});

document.getElementById('exportSummary').addEventListener('click', ()=>{
  const headers = ['StudentName','Mission','Grade','Score(%)','Time(s)','Errors','VerificationCode'];
  const csvRows = [headers, ...rows.map(r => headers.map(h => r[h] || ''))];
  const csv = csvRows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Class_Summary_${Date.now()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
